version: "3.8"

services:
  api:
    build: .
    container_name: churn_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - MODEL_PATH=data/models/xgboost_churn_model.pkl
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: churn_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: churndb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
